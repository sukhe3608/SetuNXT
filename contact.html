<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SetuNXT - Contact Us</title>
    <meta name="description" content="Get in touch with SetuNXT team">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/bootstrap-custom.css">
    <link rel="stylesheet" href="assets/css/custom.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/landing.css">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
    <link rel="stylesheet" href="assets/css/contact.css">
</head>
<body class="theme-transition">
    <!-- Header from index.html -->
    <nav>
        <div class="nav-logo" style="cursor: pointer;" onclick="window.location.href='index.html'">
            <img src="assets/images/Logo.png" alt="SetuNxt logo">
        </div>
        <ul class="nav-links">
            <li><a href="index.html#services">Services</a></li>
            <li><a href="index.html#how">How It Works</a></li>
            <li><a href="index.html#why">Why SetuNxt</a></li>
            <li><a href="index.html#usecases">Use Cases</a></li>
        </ul>
        <div class="nav-cta">
            <a href="login.html" class="btn-outline">Log In</a>
            <a href="index.html#cta" class="btn-solid">Get Started</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="contact-card card">
                <div class="card-body">
                    <div class="contact-header">
                        <h2>Get in Touch</h2>
                        <p>We'd love to hear from you. Fill in the form and we'll respond within 24h.</p>
                    </div>

                    <form id="contactForm">
                        <div class="form-row">
                            <div class="floating-group">
                                <i class="fas fa-user input-icon"></i>
                                <input type="text" id="firstName" placeholder="First Name" required>
                                <label for="firstName">First Name</label>
                            </div>
                            <div class="floating-group">
                                <i class="fas fa-user input-icon"></i>
                                <input type="text" id="lastName" placeholder="Last Name" required>
                                <label for="lastName">Last Name</label>
                            </div>
                        </div>

                        <div class="floating-group">
                            <i class="fas fa-building input-icon"></i>
                            <input type="text" id="company" placeholder="Company Name (optional)">
                            <label for="company">Company Name</label>
                        </div>

                        <div class="form-row">
                            <div class="floating-group">
                                <i class="fas fa-envelope input-icon"></i>
                                <input type="email" id="email" placeholder="Email Address" required>
                                <label for="email">Email Address</label>
                            </div>
                            <div class="floating-group">
                                <i class="fas fa-phone-alt input-icon"></i>
                                <input type="tel" id="phone" placeholder="Phone Number" required>
                                <label for="phone">Phone Number</label>
                            </div>
                        </div>

                        <div class="floating-group">
                            <i class="fas fa-tasks input-icon"></i>
                            <select id="service" required>
                                <option value="" disabled selected hidden></option>
                                <option value="RCS">RCS Business Messaging</option>
                                <option value="Email">Email</option>
                                <option value="WhatsApp">WhatsApp Business</option>
                            </select>
                            <label for="service">Service Required</label>
                        </div>

                        <div class="floating-group floating-textarea">
                            <i class="fas fa-comment-dots input-icon"></i>
                            <textarea id="message" placeholder="Your Message" rows="5" required></textarea>
                            <label for="message">Your Message</label>
                        </div>

                        <button type="submit" class="btn-submit mt-2">
                            <i class="fas fa-paper-plane"></i> Send Enquiry
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/theme.js"></script>

    <script>
        (function() {
            'use strict';

            // Theme initialization
            const savedTheme = localStorage.getItem('setunxt-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.body.classList.add('dark-mode');
                document.body.classList.remove('light-mode');
                document.documentElement.setAttribute('data-theme', 'dark');
                document.documentElement.setAttribute('data-bs-theme', 'dark');
            } else {
                document.body.classList.add('light-mode');
                document.body.classList.remove('dark-mode');
                document.documentElement.setAttribute('data-theme', 'light');
                document.documentElement.setAttribute('data-bs-theme', 'light');
            }

            // Logo click handler (already inline, but we keep this as fallback)
            const logo = document.querySelector('.nav-logo');
            if (logo) {
                logo.addEventListener('click', function(e) {
                    window.location.href = 'index.html';
                });
            }

            const form = document.getElementById('contactForm');
            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const firstName = document.getElementById('firstName').value.trim();
                const lastName = document.getElementById('lastName').value.trim();
                const email = document.getElementById('email').value.trim();
                const phone = document.getElementById('phone').value.trim();
                const service = document.getElementById('service').value;
                const message = document.getElementById('message').value.trim();

                if (!firstName || !lastName || !email || !phone || !service || !message) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops...',
                        text: 'Please fill in all required fields.',
                        customClass: { popup: 'custom-swal' },
                        confirmButtonColor: '#1a6fd4'
                    });
                    return;
                }

                if (!email.includes('@') || !email.includes('.')) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Invalid Email',
                        text: 'Please enter a valid email address.',
                        customClass: { popup: 'custom-swal' },
                        confirmButtonColor: '#1a6fd4'
                    });
                    return;
                }

                // Success popup – instant close, no fade
                Swal.fire({
                    icon: 'success',
                    title: 'Enquiry Sent!',
                    html: `
                        <div style="text-align: left; margin-top: 0.5rem;">
                            <p><strong>Name:</strong> ${firstName} ${lastName}</p>
                            <p><strong>Email:</strong> ${email}</p>
                            <p><strong>Service:</strong> ${service}</p>
                            <p style="margin-top: 0.75rem; font-style: italic; color: #64748b;">
                                 We'll contact you shortly.
                            </p>
                        </div>
                    `,
                    customClass: {
                        popup: 'custom-swal',
                        confirmButton: 'swal2-confirm'
                    },
                    showConfirmButton: true,
                    confirmButtonColor: '#1a6fd4',
                    confirmButtonText: 'OK',
                    }).then(() => {
                    // Reset form after popup closes (optional)
                    form.reset();
                });
            });
        })();
    </script>
</body>
</html>
