<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SetuNXT - Manage RCS Credit</title>
    <meta name="description" content="Update RCS credit balance for users">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/bootstrap-custom.css">
    <link rel="stylesheet" href="assets/css/custom.css">
    <link rel="stylesheet" href="assets/css/agents.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">

    <!-- Theme transition & initial theme -->
    <style>
        body:not(.dark-mode):not(.light-mode) { background-color: #f8f9fa; }
        body.theme-transition *:not(.fa-solid, .fa-regular, .fa-light, .fa-thin, .fa-duotone, .fa-brands) {
            transition: background-color 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        border-color 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        color 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        fill 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        stroke 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }
        /* Fine-tuning for available balance card */
        .bg-light { background-color: rgba(26,111,212,0.05) !important; }
        .dark-mode .bg-light { background-color: #2d3748 !important; border-color: #475569 !important; }
        .dark-mode #availableBalance { color: #e2e8f0 !important; }
        .form-check-input { margin-top: 0.15rem; }
        .form-check-label i { font-size: 1rem; }
    </style>
</head>
<body class="theme-transition">
    <!-- Overlay for mobile menu -->
    <div class="overlay" id="overlay"></div>

    <!-- Header Component (loaded via loadComponents.js) -->
    <div id="header-placeholder"></div>

    <!-- Sidebar Component -->
    <div id="sidebar-placeholder"></div>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <div class="container-fluid px-3 px-md-4 px-lg-3">
            <!-- Page Header -->
            <div class="page-header py-3">
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-2">
                    <h4 class="fw-bold text-dark mb-0">MANAGE RCS CREDIT</h4>
                    <a href="dashboard.html" class="btn btn-outline-secondary btn-sm">
                        <i class="fas fa-arrow-left me-1"></i> Back to Dashboard
                    </a>
                </div>
            </div>

            <!-- Credit Update Card -->
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h5 class="card-title mb-4 d-flex align-items-center">
                        <i class="fas fa-edit text-primary me-2"></i>
                        UPDATE RCS CREDIT
                    </h5>

                    <form id="rcsCreditForm">
                        <div class="row g-4">
                            <!-- User Name - now a dropdown -->
                            <div class="col-md-6 col-lg-4">
                                <div class="form-group">
                                    <label for="userName" class="form-label fw-semibold">User Name*</label>
                                    <select class="form-select" id="userName" required>
                                        <option value="kunal@ppservices.in" selected>kunal@ppservices.in</option>
                                        <option value="alex@example.com">alex@example.com</option>
                                        <option value="maria@company.com">maria@company.com</option>
                                        <option value="raj@startup.in">raj@startup.in</option>
                                        <option value="priya@business.com">priya@business.com</option>
                                    </select>
                                </div>
                            </div>

                            <!-- RCS Type -->
                            <div class="col-md-6 col-lg-4">
                                <div class="form-group">
                                    <label for="rcsType" class="form-label fw-semibold">RCS Type*</label>
                                    <select class="form-select" id="rcsType" required>
                                        <option value="All" selected>All</option>
                                        <option value="Transactional">Transactional</option>
                                        <option value="Promotional">Promotional</option>
                                        <option value="OTP">OTP</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Amount (RCS Balance) -->
                            <div class="col-md-6 col-lg-4">
                                <div class="form-group">
                                    <label for="rcsBalance" class="form-label fw-semibold">Amount*</label>
                                    <input type="number" class="form-control" id="rcsBalance" 
                                           value="0" min="0" step="1" placeholder="Enter amount" required>
                                </div>
                            </div>

                            <!-- Current Available Balance (dynamic) -->
                            <div class="col-12">
                                <div class="bg-light p-3 rounded-3 d-flex align-items-center border">
                                    <i class="fas fa-wallet text-primary me-3 fs-4"></i>
                                    <div>
                                        <span class="text-muted small text-uppercase">Current Available Balance</span>
                                        <div class="fs-3 fw-bold text-dark" id="availableBalance">99,780</div>
                                    </div>
                                </div>
                                <!-- Preview of new balance -->
                                <div class="mt-2 text-end text-muted small" id="newBalancePreview"></div>
                            </div>

                            <!-- Credit/Debit Radio -->
                            <div class="col-12">
                                <label class="form-label fw-semibold d-block mb-2">Transaction Type*</label>
                                <div class="d-flex flex-wrap gap-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="transactionType" 
                                               id="creditRadio" value="credit" checked>
                                        <label class="form-check-label fw-semibold" for="creditRadio">
                                            <i class="fas fa-plus-circle text-success me-1"></i> Credit
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="transactionType" 
                                               id="debitRadio" value="debit">
                                        <label class="form-check-label fw-semibold" for="debitRadio">
                                            <i class="fas fa-minus-circle text-danger me-1"></i> Debit
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-primary px-5 py-2" id="submitBtn">
                                    <i class="fas fa-check me-2"></i> Submit
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Custom JS (theme, component loader, init) -->
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/loadComponents.js"></script>
    <script src="assets/js/initComponents.js"></script>

    <!-- Credit/Debit Logic -->
    <script>
        (function() {
            'use strict';

            // ---- Theme initialization (ensures dark mode applied) ----
            const savedTheme = localStorage.getItem('setunxt-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.body.classList.add('dark-mode');
                document.body.classList.remove('light-mode');
                document.documentElement.setAttribute('data-theme', 'dark');
                document.documentElement.setAttribute('data-bs-theme', 'dark');
            } else {
                document.body.classList.add('light-mode');
                document.body.classList.remove('dark-mode');
                document.documentElement.setAttribute('data-theme', 'light');
                document.documentElement.setAttribute('data-bs-theme', 'light');
            }

            // ---- Credit/Debit logic ----
            const balanceElement = document.getElementById('availableBalance');
            const amountInput = document.getElementById('rcsBalance');
            const creditRadio = document.getElementById('creditRadio');
            const debitRadio = document.getElementById('debitRadio');
            const form = document.getElementById('rcsCreditForm');
            const previewElement = document.getElementById('newBalancePreview');
            const userNameSelect = document.getElementById('userName'); // now a select

            // Current balance (as number, without commas)
            let currentBalance = 99780; // matches the initial display

            // Helper to format number with commas (Indian/ US style)
            function formatNumber(num) {
                return num.toLocaleString('en-IN'); // you can change to 'en-US' if preferred
            }

            // Update displayed balance and preview
            function updateBalanceDisplay() {
                balanceElement.textContent = formatNumber(currentBalance);
            }

            // Calculate new balance based on current input
            function calculateNewBalance() {
                const amount = parseFloat(amountInput.value) || 0;
                if (amount <= 0) return currentBalance; // no change for zero/negative
                if (creditRadio.checked) {
                    return currentBalance + amount;
                } else if (debitRadio.checked) {
                    return Math.max(currentBalance - amount, 0); // cannot go below zero
                }
                return currentBalance;
            }

            // Update the preview text (show what the new balance would be)
            function updatePreview() {
                const amount = parseFloat(amountInput.value) || 0;
                if (amount <= 0) {
                    previewElement.textContent = '';
                    return;
                }
                const newBal = calculateNewBalance();
                const operation = creditRadio.checked ? 'Credit' : 'Debit';
                previewElement.textContent = `Preview after ${operation}: ${formatNumber(newBal)}`;
            }

            // Validate amount before submit
            function validateForm() {
                const amount = parseFloat(amountInput.value) || 0;
                if (amount <= 0) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Invalid Amount',
                        text: 'Please enter a positive amount.',
                        confirmButtonColor: '#1a6fd4'
                    });
                    return false;
                }
                if (debitRadio.checked && amount > currentBalance) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Insufficient Balance',
                        text: `You cannot debit more than the available balance (${formatNumber(currentBalance)}).`,
                        confirmButtonColor: '#1a6fd4'
                    });
                    return false;
                }
                return true;
            }

            // Handle form submission
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                if (!validateForm()) return;

                const amount = parseFloat(amountInput.value);
                const transactionType = creditRadio.checked ? 'credit' : 'debit';
                const userName = userNameSelect.value; // selected username
                const rcsType = document.getElementById('rcsType').value;

                // Update the permanent balance
                if (transactionType === 'credit') {
                    currentBalance += amount;
                } else {
                    currentBalance -= amount;
                }

                // Update UI
                updateBalanceDisplay();
                updatePreview();

                // Show success message
                Swal.fire({
                    icon: 'success',
                    title: 'Transaction Successful',
                    html: `
                        <div class="text-start">
                            <p><strong>User:</strong> ${userName}</p>
                            <p><strong>Type:</strong> ${rcsType}</p>
                            <p><strong>Amount:</strong> ${formatNumber(amount)}</p>
                            <p><strong>Transaction:</strong> ${transactionType.toUpperCase()}</p>
                            <p><strong>New Balance:</strong> ${formatNumber(currentBalance)}</p>
                        </div>
                    `,
                    confirmButtonColor: '#1a6fd4',
                    background: document.body.classList.contains('dark-mode') ? '#1e293b' : '#fff',
                    color: document.body.classList.contains('dark-mode') ? '#e2e8f0' : 'inherit'
                });

                // Optionally reset amount field to 0, keep user/type as is
                amountInput.value = 0;
            });

            // Live preview on amount change or radio change
            amountInput.addEventListener('input', updatePreview);
            creditRadio.addEventListener('change', updatePreview);
            debitRadio.addEventListener('change', updatePreview);

            // Initial preview
            updateBalanceDisplay(); // ensure display is correct
            updatePreview();

            // Prevent negative input manually (already min=0, but this ensures)
            amountInput.addEventListener('change', function() {
                if (this.value < 0) this.value = 0;
                updatePreview();
            });
        })();
    </script>
</body>
</html>
